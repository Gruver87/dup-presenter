name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: npm ci

      - name: Provide typecheck fixture for generated deck
        # src/generated/deck_resolved.json is gitignored (produced per build). Typecheck only;
        # the fixture is never rendered. Without it tsc fails on a clean checkout.
        run: |
          mkdir -p src/generated
          cp tests/fixtures/deck_resolved.typecheck.json src/generated/deck_resolved.json

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Python test deps
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium and ffmpeg (live UI recorder test)
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install ffmpeg

      - name: Python syntax check
        run: python -m py_compile scripts/*.py

      - name: Python lint (pyflakes rules: undefined names, unused imports)
        run: python -m ruff check scripts tests --select F

      - name: Run presenter gate tests
        run: python -m unittest discover -s tests -v
