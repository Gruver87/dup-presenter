<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example dashboard</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #0b1020; color: #e5f9ff; }
    header { padding: 32px 48px; font-size: 28px; font-weight: 700; }
    main { padding: 0 48px 48px; display: grid; gap: 24px; }
    .card { background: #111a33; border: 1px solid #1f2b4d; border-radius: 14px; padding: 24px; }
    input { font-size: 20px; padding: 12px 16px; width: 520px; border-radius: 10px; border: 1px solid #00ffd5; background: #070c1a; color: #e5f9ff; }
    button { font-size: 20px; padding: 12px 24px; border-radius: 10px; border: 0; background: #00ffd5; color: #03071a; font-weight: 700; cursor: pointer; }
    #result { display: inline-block; margin-top: 16px; font-size: 22px; color: #fbbf24; min-height: 30px; }
    .tall { height: 1600px; background: linear-gradient(#111a33, #0b1020); }
  </style>
</head>
<body>
  <header>Example dashboard (local demo page)</header>
  <main>
    <section class="card">
      <input id="query" placeholder="Search a symbol">
      <button id="go">Search</button>
      <div id="result"></div>
    </section>
    <section class="card tall">Scroll down: this section is intentionally tall.</section>
  </main>
  <script>
    document.getElementById('go').addEventListener('click', () => {
      const q = document.getElementById('query').value.trim() || 'nothing';
      document.getElementById('result').textContent = 'Results for: ' + q;
    });
  </script>
</body>
</html>
